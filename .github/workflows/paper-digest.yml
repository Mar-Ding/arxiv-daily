# AI学术论文智能日报系统 — GitHub Actions 工作流
# 定时运行：周一至周五 23:00 UTC (北京时间次日 07:00)

name: AI Paper Digest

on:
  schedule:
    - cron: '0 23 * * 1-5'   # 周一到周五 23:00 UTC = 07:00 北京时间
  workflow_dispatch:          # 支持手动触发

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch papers & run analysis
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          QQ_SMTP_PASSWORD: ${{ secrets.QQ_SMTP_PASSWORD }}
          QQ_SENDER: ${{ secrets.QQ_SENDER }}
          QQ_RECEIVER: ${{ secrets.QQ_RECEIVER }}
        run: |
          python -m paper_digest.cli digest

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-digest-output
          path: |
            output/
            data/
          retention-days: 7
