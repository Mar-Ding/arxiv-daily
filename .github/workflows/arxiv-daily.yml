name: arXiv Daily Digest

on:
  schedule:
    # 07:00 Beijing = 23:00 UTC previous day, Mon-Fri (papers available after 20:00 UTC cutoff)
    - cron: '0 23 * * 1-5'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run arXiv daily digest
        run: python arxiv_daily.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL || 'https://api.deepseek.com/v1' }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL || 'deepseek-chat' }}
          QQ_SMTP_PASSWORD: ${{ secrets.QQ_SMTP_PASSWORD }}
          QQ_SENDER: ${{ secrets.QQ_SENDER || '2105845780@qq.com' }}
          QQ_RECEIVER: ${{ secrets.QQ_RECEIVER || '2105845780@qq.com' }}
